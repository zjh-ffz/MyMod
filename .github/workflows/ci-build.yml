name: Build & Test MyMod PGP

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # 支持手动触发：gh workflow run ci-build.yml 或网页 Run workflow
  workflow_dispatch:

env:
  JAVA_VERSION: 17
  FORGE_VERSION: 1.20.1-47.4.1
  MOD_VERSION: 1.1.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 放在 job 级，step 的 if 才能判断到（secrets 不能直接写进 if）
      GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GRADLE_CACHE_KEY: ${{ secrets.GRADLE_CACHE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          cache-encryption-key: ${{ env.GRADLE_CACHE_KEY }}

      - name: Import GPG key
        if: ${{ env.GPG_PRIVATE_KEY_BASE64 != '' }}
        run: |
          export GNUPGHOME=$(mktemp -d)
          echo "$GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import

      - name: Build Mod (with tests)
        run: ./gradlew build --no-daemon --no-configuration-cache

      - name: Sign JAR with GPG
        if: ${{ env.GPG_PRIVATE_KEY_BASE64 != '' }}
        run: |
          export GNUPGHOME=$(mktemp -d)
          echo "$GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor build/libs/mymod-${{ env.MOD_VERSION }}.jar

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mymod-${{ env.MOD_VERSION }}
          path: |
            build/libs/mymod-${{ env.MOD_VERSION }}.jar

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/mymod-${{ env.MOD_VERSION }}.jar
          generate_release_notes: true
